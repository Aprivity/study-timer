name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed release APK (requires signing secrets and main)
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate build mode and signing configuration
        id: mode
        env:
          RELEASE: ${{ inputs.release || false }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          mode=debug
          if [[ "$RELEASE" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "Release APKs must build from main" >&2; exit 1; }
            for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              [[ -n "${!name}" ]] || { echo "Missing signing secret: $name. See docs/android.md" >&2; exit 1; }
            done
            mode=release
          fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - name: Check and export web app
        env:
          DEPLOY_TARGET: android
          NEXT_PUBLIC_AI_API_BASE_URL: /api
        run: |
          npm run android:check
          npm test
          npm run lint
          npm run build
          npm run android:prepare
      - name: Restore release signing key
        if: steps.mode.outputs.value == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/focus-release.jks"
      - name: Compile, test and lint Android
        env:
          MODE: ${{ steps.mode.outputs.value }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/focus-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          task=assembleDebug
          [[ "$MODE" != release ]] || task=assembleRelease
          ./android/gradlew --no-daemon -p android "$task" testDebugUnitTest lintDebug
      - name: Verify APK and package artifacts
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p apk-dist
          apk="aprivity-focus-${version}-${MODE}.apk"
          cp "android/app/build/outputs/apk/${MODE}/app-${MODE}.apk" "apk-dist/$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "apk-dist/$apk"
          (cd apk-dist && sha256sum "$apk" > "${apk}.sha256")
          echo "APK: $apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from this run's android-${MODE} artifact." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-${{ steps.mode.outputs.value }}
          path: apk-dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/focus-release.jks"
