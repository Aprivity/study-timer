name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix (for example: 1.4.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: study-timer-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          set -Eeuo pipefail
          npm test
          npm run lint
          DEPLOY_TARGET=self-hosted npm run build
          test -f out/index.html
          test -d out/_next

      - name: Validate release request
        id: release_meta
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "ERROR: version must be valid SemVer without a leading v" >&2
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" || "$LOCK_VERSION" != "$VERSION" ]]; then
            echo "ERROR: package.json and package-lock.json versions must both equal ${VERSION}" >&2
            exit 1
          fi

          TAG="v${VERSION}"

          git fetch origin main --no-tags
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$REMOTE_MAIN_SHA" ]]; then
            echo "ERROR: main moved after this workflow started; run the release workflow again" >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "ERROR: tag ${TAG} already exists" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package self-hosted export
        id: package
        env:
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          ARCHIVE="study-timer-${TAG}-self-hosted.tar.gz"
          tar -C out -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Create annotated release tag
        env:
          TAG: ${{ steps.release_meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          TAG_OBJECT_SHA="$(
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="$TAG" \
              -f message="Release $TAG" \
              -f object="$GITHUB_SHA" \
              -f type="commit" \
              --jq '.sha'
          )"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="$TAG_OBJECT_SHA" \
            >/dev/null

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.release_meta.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          cleanup_tag() {
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup_tag ERR

          args=(
            "$TAG"
            "$ARCHIVE"
            "${ARCHIVE}.sha256"
            --verify-tag
            --title "$TAG"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
          trap - ERR

      - name: Show release
        env:
          TAG: ${{ steps.release_meta.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG"
